name: docs

# Документація як код: lint -> контракт -> strict-збірка -> (лише main) деплой на GitHub Pages
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Повна історія потрібна плагіну git-revision-date-localized (дати редагування)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Python і залежності документації
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      # 3. Стиль Markdown (markdownlint)
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.13.0 "README.md" "CHANGELOG.md" "docs/**/*.md"

      # 4. Контракт API (Spectral): поріг - 0 errors
      - name: Spectral lint
        run: npx --yes @stoplight/spectral-cli@6 lint docs/api/openapi.yaml --ruleset .spectral.yaml

      # 5. Безперервний аудит актуальності: front matter + прострочені review_date
      - name: Review-date audit
        run: python scripts/docs_review_audit.py

      # 6. Strict-збірка: будь-яке попередження (мертве посилання, сторінка поза nav) -> Exit Code 1
      - name: mkdocs build --strict
        run: mkdocs build --strict

      - name: Upload site artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # 7. Деплой на GitHub Pages - лише з основної гілки й лише після зеленої збірки
  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
